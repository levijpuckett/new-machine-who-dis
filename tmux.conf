# remap prefix from 'C-b' to 'C-t'
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind R source-file ~/.tmux.conf

# "r" to rename the session, "t" to rename the window.
bind r command-prompt -I "#S" "rename-session '%%'"
bind t command-prompt -I "#S" "rename-window '%%'"

# split panes using / and -
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new windows in the same directory.
unbind c
bind c new-window -c "#{pane_current_path}"

# switch panes using Alt-JIKL without prefix
bind -n M-j select-pane -L
bind -n M-l select-pane -R
bind -n M-i select-pane -U
bind -n M-k select-pane -D

# switch windows using Alt-Ctl-NP without prefix
bind -n C-M-l select-window -n
bind -n C-M-j select-window -p

# New session shortcut
bind S new-session

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# statusbar
set -g status-position bottom
set -g status-justify left

#set -g status-left ''
set -g status-left-length 100

set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
